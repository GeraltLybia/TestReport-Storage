services:
  backend:
    build:
      context: ./backend
    environment:
      APP_STORAGE_ROOT: /app/storage
      APP_MAX_REPORTS: 10
      # Jira: bugs from failed tests, filed by a service account (see README)
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-}
      JIRA_VERIFY_SSL: ${JIRA_VERIFY_SSL:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
    restart: unless-stopped
    volumes:
      - ./storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
